[global]
logfile = /var/log/docker-tcp-switchboard.log
loglevel = DEBUG

#[dockeroptions:differentcontainer]
#ports={"8808/tcp":null}
#volumes={"/home/ubuntu/mountthisfolder/": {"bind": "/mnd/folderincointainer/", "mode": "rw"}}
#network = the network of the container. Used for the hacking one prob. Honestly, we can just have NMAP run on the interal docker host. 

[profile:crypto]
innerport = 22
outerport = 40000
container = crypto:latest
limit = 0
reuse = false

[profile:linux_box1_breadcrumbs]
innerport = 22
outerport = 40001
container = linux1:latest
limit = 0
reuse = false

[profile:linux_box2_haystack]
innerport = 22
outerport = 40002
container = linux2:latest
limit = 0
reuse = false

[profile:linux_box3_locked_pipeline]
innerport = 22
outerport = 40003
container = linux3:latest
limit = 0
reuse = false

[profile:windows_box1_ghosts]
innerport = 22
outerport = 40004
container = win1:latest
limit = 0
reuse = false

[profile:windows_box2_restricted_protocol]
innerport = 22
outerport = 40005
container = win2:latest
limit = 0
reuse = false

[profile:windows_box3_persistence]
innerport = 22
outerport = 40006
container = win3:latest
limit = 0
reuse = false

[profile:hack_box1_network_recon]
innerport = 22
outerport = 40007
container = hack1:latest
limit = 0
reuse = false

[profile:hack_box2_cracking_suite]
innerport = 22
outerport = 40008
container = hack2:latest
limit = 0
reuse = false

[profile:hack_box3_web_enum]
innerport = 22
outerport = 40009
container = hack3:latest
limit = 0
reuse = false

[dockeroptions:hack_box1_network_recon]
cap_add=["NET_RAW","NET_ADMIN"]
network=hack_ipn1_net

[dockeroptions:hack_box3_web_enum]
cap_add=["NET_RAW","NET_ADMIN"]
network=hack_ipn3_net

[dockeroptions:windows_box3_persistence]
volumes={"/home/ipn/IPN/Windows/box3_persistence/IPN_Summit_Data": {"bind": "/mnt/ipn_summit_data", "mode": "ro"}}
