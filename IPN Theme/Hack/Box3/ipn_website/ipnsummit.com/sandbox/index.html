<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox?</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, rgba(252,211,77,0.08), transparent 25%),
                  radial-gradient(circle at 80% 10%, rgba(52,211,153,0.08), transparent 25%),
                  #0b1020;
      color: #e5e7eb;
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 720px;
      background: #0f172a;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .content {
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.5rem; }
    p { margin: 0.4rem 0; color: #cbd5e1; }
    .signoff { color: #fcd34d; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img alt="A sandbox with toy tools" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-HpbZ_Ct0Ms3agP1LmqIvzZ7fFz-qr3_6kw&s">
    <div class="content">
      <h1>Sandbox Request Fulfilled*</h1>
      <p>They asked me for a sandbox? ChatGPT said this would be good? I don't know what a sanbox is :p</p>
      <p class="signoff">- Vibe Coder</p>
    </div>
  </div>
</body>
</html>
